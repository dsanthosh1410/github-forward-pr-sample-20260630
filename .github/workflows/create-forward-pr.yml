name: Create forward PR on merge

on:
  push:
    branches:
      - develop

permissions:
  contents: read
  pull-requests: write

jobs:
  create-forward-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Create PR from develop to staging
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = "develop";
            const base = "staging";
            const pushedBy = context.actor;

            const existing = await github.rest.pulls.list({
              owner,
              repo,
              state: "open",
              head: `${owner}:${head}`,
              base
            });

            if (existing.data.length > 0) {
              core.info("Forward PR already exists. Skipping creation.");
              return;
            }

            await github.rest.pulls.create({
              owner,
              repo,
              head,
              base,
              title: `Promote ${head} to ${base}`,
              body: `This PR was created automatically after a push to ${head} by ${pushedBy}.`
            });
